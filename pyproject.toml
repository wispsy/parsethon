[project]
name = "parsethon"
version = "0.3.0"
description = "Extensible Python Lexical Parser and Tongue Translation System"
readme = "README.md"
license = "MIT"
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "expose-interface>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/wispsy/parsethon"
Repository = "https://github.com/wispsy/parsethon"
Issues = "https://github.com/wispsy/parsethon/issues"
Documentation = "https://github.com/wispsy/parsethon/tree/main/docs"

[project.scripts]
parsethon = "parsethon.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "pytest>=9.2.0",
]
