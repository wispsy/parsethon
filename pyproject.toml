[project]
name = "parsethon"
version = "0.1.0"
description = "Extensible Python Lexical Parser and Tongue Translation System"
readme = "README.md"
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "expose-interface>=0.1.0",
]

[project.scripts]
parsethon = "parsethon.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "pytest>=9.2.0",
]
